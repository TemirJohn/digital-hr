spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/digitalhr
    username: digitalhr
    password: digitalhr
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: JanaPostDigitalHR2024SecretKeyForJWTTokenGenerationMinimum256Bits!!
  expiration: 86400000  # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    kz.janapost: DEBUG
    org.springframework.security: INFO
